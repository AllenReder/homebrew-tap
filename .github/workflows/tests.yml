name: Test Formula

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479

      - name: Test Formula
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Formula/tmh.rb ]]; then
            echo "Formula/tmh.rb has not been published yet."
            exit 0
          fi
          brew tap-new --no-git tmh-test/tap
          tap_dir="$(brew --repository tmh-test/tap)"
          install -m 0644 Formula/tmh.rb "$tap_dir/Formula/tmh.rb"
          brew style tmh-test/tap/tmh
          brew audit --strict --online tmh-test/tap/tmh
          brew install tmh-test/tap/tmh
          brew test tmh-test/tap/tmh

          if [[ "${RUNNER_OS}" == "macOS" && -f Casks/not-boring-notch.rb ]]; then
            mkdir -p "$tap_dir/Casks"
            install -m 0644 Casks/not-boring-notch.rb "$tap_dir/Casks/not-boring-notch.rb"
            brew style --cask tmh-test/tap/not-boring-notch
            brew audit --cask tmh-test/tap/not-boring-notch
          fi
