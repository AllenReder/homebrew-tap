name: Test Formula

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Homebrew on Linux
        if: runner.os == 'Linux'
        uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9

      - name: Test Formula
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f Formula/tmh.rb ]]; then
            echo "Formula/tmh.rb has not been published yet."
            exit 0
          fi
          brew tap-new --no-git tmh-test/tap
          tap_dir="$(brew --repository tmh-test/tap)"
          install -m 0644 Formula/tmh.rb "$tap_dir/Formula/tmh.rb"
          brew style tmh-test/tap/tmh
          brew audit --strict --online tmh-test/tap/tmh
          brew install tmh-test/tap/tmh
          brew test tmh-test/tap/tmh
